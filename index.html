<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IzyChartAnalisis - Chart Analisa AI Saham Indonesia</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
    background:#0B1739; color:#E7EEFF; line-height:1.5; padding:14px;
  }
  .header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .logo{ display:flex; align-items:center; gap:10px; }
  .logo-icon{
    width:40px; height:40px; border-radius:10px; font-size:22px;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg,#1E5AF8,#0DBD8B);
  }
  .logo h1{ font-size:17px; }
  .logo small{ display:block; font-size:10px; color:#8FA3C8; font-weight:normal; }

  .status-live{
    display:inline-flex; align-items:center; gap:6px;
    background:rgba(22,199,132,.15); color:#16C784;
    padding:6px 12px; border-radius:20px; font-size:12px; font-weight:bold;
  }
  .dot{ width:8px; height:8px; border-radius:50%; background:#16C784; animation:kedip 1.2s infinite; }
  @keyframes kedip{ 0%,100%{opacity:1;} 50%{opacity:.2;} }

  .pilih{ display:flex; gap:8px; margin-bottom:12px; }
  select{
    flex:1; background:#16244F; color:#fff; border:1px solid #26356B;
    padding:11px; border-radius:8px; font-size:15px;
  }
  .cari{
    flex:0 0 88px; background:#1E5AF8; color:#fff; border:none;
    border-radius:8px; font-size:14px; font-weight:bold; cursor:pointer;
  }
  .input-nama{
    width:100%; background:#16244F; color:#fff; border:1px solid #26356B;
    padding:11px; border-radius:8px; font-size:15px; margin-bottom:12px;
  }

  .card{ background:#111E44; border:1px solid #26356B; border-radius:14px; padding:14px; margin-bottom:12px; }
  .card h3{ font-size:12px; color:#8FA3C8; text-transform:uppercase; letter-spacing:1px; margin-bottom:10px; }

  .atas{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px; flex-wrap:wrap; gap:8px; }
  .harga-besar{ font-size:28px; font-weight:bold; }
  .ticker{ color:#8FA3C8; font-size:13px; margin-bottom:4px; }
  .waktu{ color:#16C784; font-size:11px; font-family:monospace; margin-bottom:12px; }
